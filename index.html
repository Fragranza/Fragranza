<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Fragranza — Price List</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--text:#f0ede8;--muted:#888;--accent:#c8a96e;--danger:#e05555;--radius:14px;--radius-sm:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:0.5px solid var(--border);height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;backdrop-filter:blur(20px);}
.logo{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;letter-spacing:0.04em;}
.logo span{color:var(--accent);}
.tagline{font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
.content{padding:20px 16px 60px;max-width:480px;margin:0 auto;}
.search-wrap{position:relative;margin-bottom:16px;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;}
.search-input{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px 12px 40px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;font-weight:300;outline:none;}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{border-color:var(--border2);}
.filter-row{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-btn{background:var(--bg2);border:0.5px solid var(--border);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.filter-btn.active{background:rgba(200,169,110,0.12);border-color:rgba(200,169,110,0.4);color:var(--accent);}
.p-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
.p-card.out-of-stock{opacity:0.45;}
.p-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:8px;}
.p-name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:400;color:var(--text);letter-spacing:0.01em;line-height:1.3;}
.badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.badge-sale{background:rgba(200,169,110,0.15);color:var(--accent);border:0.5px solid rgba(200,169,110,0.3);}
.badge-out{background:rgba(224,85,85,0.1);color:var(--danger);border:0.5px solid rgba(224,85,85,0.3);}
.price-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.price-cell{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 4px;text-align:center;}
.price-ml{font-size:11px;color:var(--muted);display:block;margin-bottom:4px;}
.price-amt{font-size:14px;font-weight:500;color:var(--text);display:block;font-family:'Cormorant Garamond',serif;}
.loading{text-align:center;padding:60px 20px;color:var(--muted);}
.loading svg{width:36px;height:36px;opacity:0.3;display:block;margin:0 auto 12px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{font-size:14px;}
.no-results{text-align:center;padding:40px 0;color:var(--muted);font-size:14px;}
.count-label{font-size:12px;color:var(--muted);margin-bottom:12px;}
.footer-note{text-align:center;font-size:11px;color:var(--muted);padding:20px 0 0;line-height:1.8;letter-spacing:0.02em;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:0.5px solid var(--border2);border-radius:99px;padding:10px 20px;font-size:13px;color:var(--text);opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header class="header">
  <div>
    <div class="logo">Frag<span>ranza</span></div>
    <div class="tagline">Decant Price List</div>
  </div>
</header>
<main class="content">
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="search-input" type="text" id="search" placeholder="Search perfumes..." oninput="render()" autocomplete="off" />
  </div>
  <div class="filter-row">
    <button class="filter-btn active" onclick="setFilter('all')" id="f-all">All</button>
    <button class="filter-btn" onclick="setFilter('available')" id="f-available">Available</button>
    <button class="filter-btn" onclick="setFilter('sale')" id="f-sale">On Sale</button>
    <button class="filter-btn" onclick="setFilter('out')" id="f-out">Out of Stock</button>
  </div>
  <div id="catalog">
    <div class="loading">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
      <p>Loading price list...</p>
    </div>
  </div>
  <div class="footer-note">
    All prices are in BDT (Bangladeshi Taka)<br>
    Prices may change without prior notice<br>
    Contact us on Facebook to place your order
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
const GH_RAW='https://raw.githubusercontent.com/Fragranza/Fragranza/main/perfumes.json';
const SIZES=[2,5,10,15,30];
let perfumes=[];
let activeFilter='all';

async function loadPerfumes(){
  try{
    const r=await fetch(GH_RAW+'?t='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data=await r.json();
    perfumes=data.map(p=>({...p,prices:{2:p.prices['2']||0,5:p.prices['5']||0,10:p.prices['10']||0,15:p.prices['15']||0,30:p.prices['30']||0}}));
    render();
  }catch(e){
    document.getElementById('catalog').innerHTML='<div class="no-results">Could not load price list.<br>Please try again later.</div>';
  }
}

function setFilter(f){
  activeFilter=f;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('f-'+f).classList.add('active');
  render();
}

function render(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  let list=[...perfumes].sort((a,b)=>a.name.localeCompare(b.name));
  if(q) list=list.filter(p=>p.name.toLowerCase().includes(q));
  if(activeFilter==='available') list=list.filter(p=>!p.out);
  if(activeFilter==='sale') list=list.filter(p=>p.sale);
  if(activeFilter==='out') list=list.filter(p=>p.out);
  const el=document.getElementById('catalog');
  if(!list.length){el.innerHTML='<div class="no-results">No perfumes found</div>';return;}
  el.innerHTML='<div class="count-label">'+list.length+' perfume'+(list.length!==1?'s':'')+'</div>'+
    list.map(p=>{
      const badges=(p.sale?'<span class="badge badge-sale">Sale</span>':'')+(p.out?'<span class="badge badge-out">Out of Stock</span>':'');
      const prices=SIZES.map(s=>{const pr=p.prices[s];return '<div class="price-cell"><span class="price-ml">'+s+' ml</span><span class="price-amt">'+(pr?'৳'+pr.toLocaleString():'—')+'</span></div>';}).join('');
      return '<div class="p-card '+(p.out?'out-of-stock':'')+'"><div class="p-header"><div class="p-name">'+esc(p.name)+'</div>'+(badges?'<div class="badges">'+badges+'</div>':'')+'</div><div class="price-grid">'+prices+'</div></div>';
    }).join('');
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

loadPerfumes();
</script>
</body>
</html>
