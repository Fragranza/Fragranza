<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fragranza" />
<title>Fragranza — Owner Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--text:#f0ede8;--muted:#888;--accent:#c8a96e;--accent2:#e8c98e;--danger:#e05555;--success:#5c9e6a;--radius:14px;--radius-sm:8px;--tab-h:64px;--header-h:70px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;overflow-x:hidden;}
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:0.5px solid var(--border);height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;backdrop-filter:blur(20px);}
.logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:400;letter-spacing:0.04em;color:var(--text);}
.logo span{color:var(--accent);}
.cart-pill{background:var(--accent);color:#0a0a0a;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;border:none;transition:background 0.2s;}
.cart-pill:hover{background:var(--accent2);}
.cart-pill svg{width:14px;height:14px;}
.tabs{display:flex;background:var(--bg);border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;position:sticky;top:var(--header-h);z-index:99;}
.tabs::-webkit-scrollbar{display:none;}
.tab{flex:1;min-width:80px;padding:14px 8px;text-align:center;font-size:12px;font-weight:400;color:var(--muted);cursor:pointer;border-bottom:1.5px solid transparent;transition:all 0.2s;letter-spacing:0.06em;text-transform:uppercase;white-space:nowrap;border:none;background:none;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.content{padding:20px 16px;padding-bottom:calc(var(--tab-h) + 20px);max-width:480px;margin:0 auto;}
.search-wrap{position:relative;margin-bottom:16px;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;}
.search-input{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px 12px 40px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;font-weight:300;outline:none;}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{border-color:var(--border2);}
.p-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;transition:border-color 0.2s;}
.p-card:active{border-color:var(--border2);}
.p-card.out-of-stock{opacity:0.45;}
.p-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.p-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--text);letter-spacing:0.01em;flex:1;line-height:1.3;}
.p-sl{color:var(--muted);font-size:13px;font-weight:400;margin-right:6px;}
.m-sl{color:var(--muted);font-size:12px;font-weight:400;margin-right:6px;flex-shrink:0;}
.badge{font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;margin-left:8px;white-space:nowrap;flex-shrink:0;margin-top:2px;}
.badge-sale{background:rgba(200,169,110,0.15);color:var(--accent);border:0.5px solid rgba(200,169,110,0.3);}
.badge-out{background:rgba(224,85,85,0.1);color:var(--danger);border:0.5px solid rgba(224,85,85,0.3);}
.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.size-btn{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:8px 4px;text-align:center;cursor:pointer;transition:all 0.15s;color:var(--text);font-family:'DM Sans',sans-serif;}
.size-btn:active{transform:scale(0.95);background:rgba(200,169,110,0.15);border-color:var(--accent);}
.size-btn:disabled{opacity:0.3;cursor:not-allowed;}
.size-ml{font-size:13px;font-weight:500;display:block;}
.size-price{font-size:10px;color:var(--accent);display:block;margin-top:2px;}
.order-empty{text-align:center;padding:60px 20px;color:var(--muted);}
.order-empty svg{width:48px;height:48px;opacity:0.3;margin-bottom:16px;display:block;margin-left:auto;margin-right:auto;}
.order-empty p{font-size:14px;}
.order-item{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.oi-info{flex:1;min-width:0;}
.oi-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.oi-size{font-size:12px;color:var(--muted);margin-top:2px;}
.oi-price{font-size:16px;font-weight:500;color:var(--accent);white-space:nowrap;}
.oi-remove{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;transition:color 0.15s;flex-shrink:0;}
.oi-remove:active{color:var(--danger);}
.oi-remove svg{width:16px;height:16px;}
.summary-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:12px;}
.sum-title{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;color:var(--muted);}
.sum-row:last-of-type{border-bottom:none;}
.sum-row span:last-child{color:var(--text);}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:8px;border-top:0.5px solid var(--border2);}
.sum-total-label{font-size:14px;color:var(--muted);}
.sum-total-amt{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:var(--accent);}
.btn-clear{width:100%;background:none;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-top:10px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-clear:active{border-color:var(--danger);color:var(--danger);}
.btn-copy{width:100%;background:rgba(200,169,110,0.1);border:0.5px solid rgba(200,169,110,0.3);border-radius:var(--radius-sm);padding:12px;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-top:8px;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-copy:active{background:rgba(200,169,110,0.2);}
.section-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;margin-top:20px;}
.section-label:first-child{margin-top:0;}
.manage-item{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);margin-bottom:6px;overflow:hidden;}
.manage-row{display:flex;align-items:center;gap:8px;padding:12px 14px;}
.manage-name{flex:1;font-size:14px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.m-btn{background:none;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;font-size:11px;font-family:'DM Sans',sans-serif;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.m-btn:active{border-color:var(--border2);color:var(--text);}
.m-btn.danger:active{border-color:var(--danger);color:var(--danger);}
.m-btn.out-active{border-color:rgba(224,85,85,0.4);color:var(--danger);}
.edit-prices{padding:10px 14px 14px;border-top:0.5px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.edit-field label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px;}
.edit-field input{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:6px;padding:6px 6px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;text-align:center;outline:none;}
.edit-field input:focus{border-color:var(--accent);}
.add-form{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-top:4px;}
.add-form-name{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;font-weight:300;outline:none;margin-bottom:10px;}
.add-form-name::placeholder{color:var(--muted);}
.add-form-name:focus{border-color:var(--border2);}
.add-form-prices{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px;}
.add-form-prices .edit-field input{padding:8px 4px;}
.btn-add{width:100%;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:13px;color:#0a0a0a;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:background 0.2s;}
.btn-add:active{background:var(--accent2);}
.step-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}
.delivery-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.delivery-card{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 6px;text-align:center;cursor:pointer;transition:border-color 0.15s;}
.del-icon{font-size:13px;letter-spacing:0.05em;color:var(--muted);margin-bottom:6px;}
.del-price{font-size:16px;font-weight:500;color:var(--accent);font-family:'Cormorant Garamond',serif;}
.bill-breakdown,.due-breakdown{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;}
.bb-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.bb-row:last-child{border-bottom:none;}
.bb-lbl{color:var(--muted);}
.bb-val{color:var(--text);font-weight:500;}
.adv-color{color:#7ec98e!important;}
.bb-total-row{padding-top:10px;}
.bb-total-lbl{font-size:14px;font-weight:500;color:var(--text);}
.bb-total-val{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;color:var(--accent);}
.due-color{color:#e05555;}
.advance-section{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;}
.advance-input-row{display:flex;align-items:center;gap:10px;}
.adv-currency{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--accent);}
.adv-input{flex:1;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:18px;font-family:'DM Sans',sans-serif;outline:none;}
.adv-input:focus{border-color:var(--accent);}
.due-section{margin-top:0;}
.toast{position:fixed;bottom:calc(var(--tab-h) + 16px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:0.5px solid var(--border2);border-radius:99px;padding:10px 20px;font-size:13px;color:var(--text);opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.page{display:none;}
.page.active{display:block;}
.filter-row{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-btn{background:var(--bg2);border:0.5px solid var(--border);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.filter-btn.active{background:rgba(200,169,110,0.12);border-color:rgba(200,169,110,0.4);color:var(--accent);}
.gender-select{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:4px 6px;font-size:11px;color:var(--muted);font-family:'DM Sans',sans-serif;cursor:pointer;flex-shrink:0;}
.copy-price-btn{background:none;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:4px 9px;font-size:11px;font-family:'DM Sans',sans-serif;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.copy-price-btn:active{border-color:var(--accent);color:var(--accent);}
.price-original{text-decoration:line-through;color:var(--muted);font-size:9px;display:block;margin-bottom:1px;}
.offer-badge{font-size:9px;color:#7ec98e;display:block;margin-top:1px;}
.offer-clear-btn{background:none;border:0.5px solid rgba(224,85,85,0.3);border-radius:var(--radius-sm);padding:4px 10px;font-size:11px;color:var(--danger);cursor:pointer;font-family:'DM Sans',sans-serif;}
.badge-offer{background:rgba(92,158,106,0.15);color:#7ec98e;border:0.5px solid rgba(92,158,106,0.3);}
.offer-panel{background:var(--bg3);border-top:0.5px solid var(--border);padding:12px 14px;}
.offer-size-table{display:flex;flex-direction:column;gap:6px;}
.offer-size-header{display:grid;grid-template-columns:36px 60px 80px 1fr 60px;gap:6px;font-size:10px;color:var(--muted);letter-spacing:0.05em;text-transform:uppercase;padding:0 4px;}
.offer-size-row{display:grid;grid-template-columns:36px 60px 80px 1fr 60px;gap:6px;align-items:center;background:var(--bg2);border-radius:var(--radius-sm);padding:8px 6px;}
.osr-size{font-size:12px;font-weight:500;color:var(--text);}
.osr-orig{font-size:11px;color:var(--muted);}
.osr-pct-wrap{display:flex;align-items:center;gap:3px;}
.osr-pct-sym{font-size:11px;color:var(--muted);}
.osr-input{width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:6px;padding:5px 4px;color:var(--text);font-size:12px;font-family:'DM Sans',sans-serif;text-align:center;outline:none;}
.osr-input:focus{border-color:var(--accent);}
.osr-final{font-size:12px;font-weight:500;color:var(--muted);text-align:right;}
.osr-final-active{color:#7ec98e;}
.btn-copy-inside{background:rgba(92,158,106,0.1);border-color:rgba(92,158,106,0.3);color:#7ec98e;}
.btn-copy-inside:active{background:rgba(92,158,106,0.2);}
#paste-input::placeholder{color:var(--muted);}
.no-results{text-align:center;padding:40px 0;color:var(--muted);font-size:14px;}
</style>
</head>
<body>
<header class="header">
  <div class="logo">Frag<span>ranza</span> <span style="font-size:11px;font-family:'DM Sans',sans-serif;background:rgba(200,169,110,0.15);color:var(--accent);border:0.5px solid rgba(200,169,110,0.3);border-radius:99px;padding:2px 8px;vertical-align:middle;letter-spacing:0.06em;">OWNER</span></div>
  <button class="cart-pill" onclick="goTab('order')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span id="cart-count">0</span> items
  </button>
</header>
<nav class="tabs">
  <button class="tab active" onclick="goTab('catalog')" id="tab-catalog">Catalog</button>
  <button class="tab" onclick="goTab('order')" id="tab-order">Order</button>
  <button class="tab" onclick="goTab('manage')" id="tab-manage">Manage</button>
  <button class="tab" onclick="goTab('pricecard')" id="tab-pricecard">Price Card</button>
</nav>
<main class="content">
  <!-- CATALOG -->
  <div class="page active" id="page-catalog">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Search perfumes…" oninput="renderCatalog()" autocomplete="off" />
    </div>
    <div class="filter-row">
      <button class="filter-btn active" id="gf-all" onclick="setGenderFilter('all')">All</button>
      <button class="filter-btn" id="gf-male" onclick="setGenderFilter('male')">Male</button>
      <button class="filter-btn" id="gf-female" onclick="setGenderFilter('female')">Female</button>
      <button class="filter-btn" id="gf-unisex" onclick="setGenderFilter('unisex')">Unisex</button>
    </div>
    <div id="catalog"></div>
  </div>
  <!-- ORDER -->
  <div class="page" id="page-order">
    <div id="paste-order-section" style="margin-bottom:12px;">
      <button onclick="togglePasteBox()" id="paste-toggle-btn" style="width:100%;background:rgba(200,169,110,0.08);border:0.5px solid rgba(200,169,110,0.3);border-radius:var(--radius-sm);padding:11px;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
        Paste Customer Order
      </button>
      <div id="paste-box" style="display:none;margin-top:8px;">
        <textarea id="paste-input" placeholder="Paste customer's copied order here..." style="width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;resize:vertical;min-height:120px;outline:none;line-height:1.6;" oninput="this.style.borderColor='var(--border2)'"></textarea>
        <button onclick="importPastedOrder()" style="width:100%;background:var(--accent);border:none;border-radius:var(--radius-sm);padding:11px;color:#0a0a0a;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;margin-top:6px;">Import Order</button>
      </div>
    </div>
    <div id="order-list"></div>
    <div id="order-summary"></div>
    <div id="custom-item-section" style="margin-top:10px;">
      <button onclick="toggleCustomBox()" id="custom-toggle-btn" style="width:100%;background:rgba(255,255,255,0.03);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:11px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v8M8 12h8"/></svg>
        Add Custom Item
      </button>
      <div id="custom-box" style="display:none;margin-top:8px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:14px;">
        <div style="font-size:11px;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;padding-bottom:6px;border-bottom:0.5px solid var(--border);">From Price List</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px;">Perfume</label>
          <select id="custom-perfume" onchange="onCustomPerfumeChange()" style="width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;"><option value="">— Select —</option></select></div>
          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px;">Size</label>
          <select id="custom-ml" onchange="onCustomMlChange()" style="width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;">
            <option value="">— ml —</option><option value="2">2 ml</option><option value="5">5 ml</option><option value="10">10 ml</option><option value="15">15 ml</option><option value="30">30 ml</option>
          </select></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;">
          <div><label style="font-size:11px;color:var(--muted);display:block;margin-bottom:5px;">Price (৳) <span id="custom-auto-price" style="color:var(--accent);font-size:10px;"></span></label>
          <input id="custom-price" type="number" min="0" placeholder="Auto / override" inputmode="numeric" style="width:100%;background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 8px;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;outline:none;text-align:center;" /></div>

async function loadFromGitHub() {
  try {
    showToast('Loading...');
    const r = await fetch('https://raw.githubusercontent.com/Fragranza/Fragranza/main/perfumes.json?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const decoded = await r.json();
    perfumes = decoded.map(p => ({
      ...p,
      prices: {2:p.prices['2']||0,5:p.prices['5']||0,10:p.prices['10']||0,15:p.prices['15']||0,30:p.prices['30']||0},
      offer: p.offer ? {pct:p.offer.pct||{},manual:p.offer.manual||{}} : null,
      gender: p.gender||'male', aliases: p.aliases||[],
      displayName: p.displayName||p.name, featured: p.featured||false, batch: p.batch||''
    }));
    nextId = Math.max(...perfumes.map(p=>p.id))+1;
    fetchSha();
    showToast('Loaded '+perfumes.length+' perfumes!');
    renderCatalog(); renderManage();
  } catch(e) {
    showToast('Load failed: '+e.message);
    renderCatalog(); renderManage();
  }
}

async function fetchSha() {
  try {
    const r = await fetch(GH_API,{headers:{'Authorization':'token '+GH_TOKEN,'User-Agent':'Fragranza-App'}});
    if(!r.ok) return;
    const data = await r.json();
    ghFileSha = data.sha;
  } catch(e){}
}

async function saveToGitHub() {
  try {
    showSaveState('saving');
    const data = perfumes.map(p => ({
      id:p.id, name:p.name, displayName:p.displayName||p.name,
      prices:{'2':p.prices[2]||0,'5':p.prices[5]||0,'10':p.prices[10]||0,'15':p.prices[15]||0,'30':p.prices[30]||0},
      out:p.out, sale:p.sale, gender:p.gender||'male', featured:p.featured||false,
      aliases:p.aliases||[], batch:p.batch||'',
      offer:p.offer?{pct:p.offer.pct||{},manual:p.offer.manual?Object.fromEntries(Object.entries(p.offer.manual).map(([k,v])=>[k,v])):{}}:null
    }));
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));
    const body = {message:'Update perfumes via owner panel',content};
    if(ghFileSha) body.sha = ghFileSha;
    const r = await fetch(GH_API,{method:'PUT',headers:{'Authorization':'token '+GH_TOKEN,'Content-Type':'application/json','User-Agent':'Fragranza-App'},body:JSON.stringify(body)});
    if(!r.ok){const e=await r.json();throw new Error(e.message);}
    const resp = await r.json();
    ghFileSha = resp.content.sha;
    showSaveState('saved');
  } catch(e) { showSaveState('error'); showToast('Save failed: '+e.message); }
}

function showSaveState(state) {
  const btn = document.getElementById('gh-save-btn');
  if(!btn) return;
  if(state==='saving'){btn.textContent='Saving...';btn.disabled=true;btn.style.opacity='0.6';}
  else if(state==='saved'){btn.textContent='✓ Saved to GitHub';btn.disabled=false;btn.style.opacity='1';btn.style.borderColor='rgba(92,158,106,0.5)';btn.style.color='#7ec98e';setTimeout(()=>{btn.textContent='Save to GitHub';btn.style.borderColor='';btn.style.color='';},3000);}
  else{btn.textContent='Save failed — retry';btn.disabled=false;btn.style.opacity='1';btn.style.borderColor='rgba(224,85,85,0.5)';btn.style.color='#e05555';}
}

function displayNameOf(p){ return(p&&(p.displayName||p.name))||''; }

function goTab(name){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
  if(name==='order') renderOrder();
  if(name==='manage') renderManage();
  if(name==='catalog') renderCatalog();
}

function setGenderFilter(g){
  genderFilter=g;
  ['all','male','female','unisex'].forEach(f=>{const b=document.getElementById('gf-'+f);if(b)b.classList.toggle('active',f===g);});
  renderCatalog();
}

function renderCatalog(){
  const q=(document.getElementById('search').value||'').toLowerCase();
  const el=document.getElementById('catalog');
  let list=perfumes.filter(p=>displayNameOf(p).toLowerCase().includes(q)||p.name.toLowerCase().includes(q)||(p.aliases||[]).some(a=>a.toLowerCase().includes(q)));
  if(genderFilter!=='all') list=list.filter(p=>(p.gender||'male')===genderFilter);
  list=list.sort((a,b)=>displayNameOf(a).localeCompare(displayNameOf(b)));
  if(!list.length){el.innerHTML='<div class="no-results">No perfumes found</div>';return;}
  el.innerHTML=list.map((p,idx)=>{
    const badges=(p.sale?'<span class="badge badge-sale">SALE</span>':'')+(p.out?'<span class="badge badge-out">OUT</span>':'');
    const btns=SIZES.map(s=>{
      const pr=p.prices[s];
      if(!pr) return '<div></div>';
      const ep=effectivePrice(p,s);
      const isOffer=ep!==pr;
      return '<button class="size-btn" onclick="addToOrder('+p.id+','+s+')" '+(p.out?'disabled':'')+'>'+
        '<span class="size-ml">'+s+'ml</span>'+
        (isOffer?'<span class="price-original">৳'+pr.toLocaleString()+'</span>':'')+
        '<span class="size-price">৳'+ep.toLocaleString()+'</span>'+
        (isOffer?'<span class="offer-badge">'+offerBadgeText(p)+'</span>':'')+
        '</button>';
    }).join('');
    return '<div class="p-card '+(p.out?'out-of-stock':'')+'">'+
      '<div class="p-header">'+
        '<div class="p-name"><span class="p-sl">'+(idx+1)+'.</span>'+esc(displayNameOf(p))+'</div>'+
        '<div style="display:flex;align-items:center;gap:6px;">'+badges+
          '<button class="copy-price-btn" onclick="copyPriceList('+p.id+')">'+
            '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Price</button>'+
        '</div>'+
      '</div>'+
      '<div class="size-grid">'+btns+'</div></div>';
  }).join('');
}

function effectivePrice(p,size){
  if(!p.offer) return p.prices[size];
  const s=String(size);
  if(p.offer.pct&&p.offer.pct[s]) return Math.round(p.prices[size]*(1-p.offer.pct[s]/100));
  if(p.offer.manual&&p.offer.manual[s]) return p.offer.manual[s];
  return p.prices[size];
}

function offerBadgeText(p){
  if(!p.offer) return '';
  const pcts=p.offer.pct?Object.values(p.offer.pct).filter(v=>v>0):[];
  const mans=p.offer.manual?Object.values(p.offer.manual).filter(v=>v>0):[];
  if(pcts.length&&mans.length) return 'OFFER';
  if(pcts.length){const u=[...new Set(pcts)];return u.length===1?u[0]+'% OFF':'OFFER';}
  if(mans.length) return 'SPECIAL';
  return '';
}

function addToOrder(pid,size){
  const p=perfumes.find(x=>x.id===pid);
  if(!p||p.out) return;
  order.push({pid,size,price:effectivePrice(p,size),origPrice:p.prices[size],name:displayNameOf(p)});
  updateBadge();
  showToast(displayNameOf(p).split(' ')[0]+' '+size+'ml added');
}

function selectDelivery(type){
  selectedDelivery=type;
  ['none','inside','outside'].forEach(t=>{const c=document.getElementById('del-card-'+t);if(c)c.style.borderColor=t===type?'var(--accent)':'var(--border)';});
  recalc();
}

function recalc(){
  const perfumeTotal=order.reduce((s,o)=>s+o.price,0);
  const delAmt=selectedDelivery==='inside'?85:selectedDelivery==='outside'?125:0;
  const grandTotal=perfumeTotal+delAmt;
  currentGrandTotal=grandTotal;
  const delRow=document.getElementById('bb-del-row');
  const delLbl=document.getElementById('bb-del-lbl');
  const delVal=document.getElementById('bb-del-val');
  if(delRow){
    if(delAmt>0){delRow.style.display='flex';delLbl.textContent=selectedDelivery==='inside'?'Inside Dhaka':'Outside Dhaka';delVal.textContent='৳'+delAmt.toLocaleString();}
    else delRow.style.display='none';
  }
  const bbTotal=document.getElementById('bb-total');
  if(bbTotal) bbTotal.textContent='৳'+grandTotal.toLocaleString();
  const advEl=document.getElementById('advance-input');
  const advance=advEl?(parseFloat(advEl.value)||0):0;
  const dueSection=document.getElementById('due-section');
  const copyTxBtn=document.getElementById('copy-transaction-btn');
  if(advance>0){
    const due=grandTotal-advance;
    if(dueSection) dueSection.style.display='block';
    if(copyTxBtn) copyTxBtn.style.display='flex';
    const dbt=document.getElementById('due-bill-total');
    const da=document.getElementById('due-adv');
    const df=document.getElementById('due-final');
    if(dbt) dbt.textContent='৳'+grandTotal.toLocaleString();
    if(da) da.textContent='- ৳'+advance.toLocaleString();
    if(df){df.textContent='৳'+Math.abs(due).toLocaleString()+(due<0?' (Overpaid)':due===0?' (Settled)':'');df.style.color=due<0?'#8ab0e8':due===0?'var(--success)':'#e05555';}
  } else {
    if(dueSection) dueSection.style.display='none';
    if(copyTxBtn) copyTxBtn.style.display='none';
  }
}

function getOrderLines(){
  const map={};
  order.forEach((o,i)=>{
    const k=o.custom?'c-'+o.name+'-'+o.price:o.pid+'-'+o.size;
    if(!map[k]) map[k]={name:o.name,size:o.size,price:o.price,qty:0,custom:o.custom};
    map[k].qty++;
  });
  return Object.values(map).map(g=>{
    const label=g.custom?g.name:g.name+' '+g.size+'ml';
    const total=g.price*g.qty;
    const qtyStr=g.qty>1?' x'+g.qty:'';
    return '- '+label+qtyStr+' — ৳'+total.toLocaleString();
  });
}

function cleanOffer(p){const hasPct=p.offer&&p.offer.pct&&Object.values(p.offer.pct).some(v=>v>0);const hasMan=p.offer&&p.offer.manual&&Object.values(p.offer.manual).some(v=>v>0);if(!hasPct&&!hasMan)p.offer=null;}

function copyPriceList(pid){

function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();try{document.execCommand('copy');showToast('Copied!');}catch(e){showToast('Could not copy');}document.body.removeChild(ta);}

function togglePasteBox(){const box=document.getElementById('paste-box');const btn=document.getElementById('paste-toggle-btn');const open=box.style.display==='none';box.style.display=open?'block':'none';btn.style.background=open?'rgba(200,169,110,0.15)':'rgba(200,169,110,0.08)';if(open)document.getElementById('paste-input').focus();}

function importPastedOrder(){
  const text=document.getElementById('paste-input').value.trim();
  if(!text){showToast('Paste an order first');return;}
  const rawLines=text.split('\n').map(l=>l.trim());
  const imported=[],mismatches=[],unresolved=[];
  function matchPerfume(rawName){
    const rn=rawName.toLowerCase().trim();if(!rn)return null;
    return perfumes.find(p=>{
      const pn=p.name.toLowerCase();const dn=displayNameOf(p).toLowerCase();
      const aliasMatch=(p.aliases||[]).some(a=>a.toLowerCase()===rn||a.toLowerCase().includes(rn)||rn.includes(a.toLowerCase()));
      return pn===rn||dn===rn||pn.includes(rn)||dn.includes(rn)||rn.includes(pn)||rn.includes(dn)||aliasMatch||pn.split(' ').filter(w=>w.length>2&&rn.includes(w)).length>=2||rn.split(' ').filter(w=>w.length>2&&pn.includes(w)).length>=2;
    });
  }
  function extractSize(l){const m=l.match(/(\d+)\s*ml/i);return m?parseInt(m[1]):null;}
  function extractPrice(l){const m=l.match(/\u09f3([\d,]+)/);return m?parseInt(m[1].replace(/,/g,'')):null;}
  function extractQty(l){const m=l.match(/[x\xd7]\s*(\d+)/i);return m?parseInt(m[1]):1;}
  function cleanName(l){return l.replace(/[-•*]+/g,'').replace(/\d+\s*ml/gi,'').replace(/[x\xd7]\s*\d+/gi,'').replace(/\u09f3[\d,]+/g,'').replace(/[\u2014\u2013-]+$/,'').trim();}
  const lines=[];
  rawLines.forEach(l=>{if(/^\s*$/.test(l)){lines.push('');return;}if(/^(total|subtotal|delivery|advance|due|perfume total|grand total)/i.test(l))return;lines.push(l);});
  let pendingNames=[];
  function flushPending(size,qty){
    pendingNames.forEach(rawName=>{
      const perfume=matchPerfume(rawName);
      if(perfume&&size&&SIZES.includes(size)){const cp=effectivePrice(perfume,size);for(let i=0;i<qty;i++)imported.push({pid:perfume.id,size,price:cp,name:displayNameOf(perfume),custom:false});}
      else if(rawName)unresolved.push(rawName+(size?' '+size+'ml':''));
    });pendingNames=[];
  }
  lines.forEach(line=>{
    if(!line)return;
    const size=extractSize(line),price=extractPrice(line),qty=extractQty(line),name=cleanName(line);
    if(size){
      if(name){
        const perfume=matchPerfume(name);
        if(perfume){const cp=effectivePrice(perfume,size);const uc=price&&qty>1?Math.round(price/qty):price;if(uc&&uc!==cp)mismatches.push({name:displayNameOf(perfume),size,claimed:uc,correct:cp});for(let i=0;i<qty;i++)imported.push({pid:perfume.id,size,price:cp,name:displayNameOf(perfume),custom:false});}
        else{const p=price&&qty>1?Math.round(price/qty):(price||0);for(let i=0;i<qty;i++)imported.push({pid:'custom',size,price:p,name:name+' '+size+'ml',custom:true});}
      } else flushPending(size,qty);
    } else {if(name)pendingNames.push(name);}
  });
  if(pendingNames.length)pendingNames.forEach(n=>unresolved.push(n+' (no size found)'));
  if(!imported.length){showToast(unresolved.length?'Could not match: '+unresolved.join(', '):'Could not read order');return;}
  order=[...order,...imported];updateBadge();
  document.getElementById('paste-input').value='';document.getElementById('paste-box').style.display='none';document.getElementById('paste-toggle-btn').style.background='rgba(200,169,110,0.08)';
  renderOrder();
  if(mismatches.length>0){
    const mh=mismatches.map(m=>'<div style="padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;"><span style="color:var(--text);">'+esc(m.name)+' '+m.size+'ml</span><br><span style="color:var(--danger);">Customer said ৳'+m.claimed.toLocaleString()+'</span> → <span style="color:#7ec98e;">Your price ৳'+m.correct.toLocaleString()+'</span></div>').join('');
    const w=document.createElement('div');w.id='mismatch-warning';w.style.cssText='background:rgba(224,85,85,0.08);border:0.5px solid rgba(224,85,85,0.3);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:12px;';
    w.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-size:12px;font-weight:500;color:var(--danger);">⚠ Price mismatch ('+mismatches.length+')</span><button onclick="document.getElementById('mismatch-warning').remove()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0;">✕</button></div><div style="border-top:0.5px solid var(--border);padding-top:6px;">'+mh+'</div><p style="font-size:11px;color:var(--muted);margin-top:8px;">Order filled with your correct prices.</p>';
    const ex=document.getElementById('mismatch-warning');if(ex)ex.remove();
    document.getElementById('order-list').parentNode.insertBefore(w,document.getElementById('order-list'));
    showToast('⚠ '+mismatches.length+' price mismatch'+(mismatches.length>1?'es':'')+'!');
  } else if(unresolved.length) showToast('Imported '+imported.length+', missed: '+unresolved.slice(0,3).join(', '));
  else showToast('Imported '+imported.length+' item'+(imported.length!==1?'s':'')+'!');
}

function toggleCustomBox(){
  const box=document.getElementById('custom-box');const btn=document.getElementById('custom-toggle-btn');const open=box.style.display==='none';
  box.style.display=open?'block':'none';btn.style.background=open?'rgba(255,255,255,0.06)':'rgba(255,255,255,0.03)';btn.style.color=open?'var(--text)':'var(--muted)';
  if(open){const sel=document.getElementById('custom-perfume');const sorted=[...perfumes].sort((a,b)=>displayNameOf(a).localeCompare(displayNameOf(b)));sel.innerHTML='<option value="">— Select perfume —</option>'+sorted.map(p=>'<option value="'+p.id+'">'+esc(displayNameOf(p))+'</option>').join('');}
}
function onCustomPerfumeChange(){const pid=parseInt(document.getElementById('custom-perfume').value);const ml=parseInt(document.getElementById('custom-ml').value);if(pid&&ml){const p=perfumes.find(x=>x.id===pid);if(p){document.getElementById('custom-price').value=effectivePrice(p,ml);document.getElementById('custom-auto-price').textContent='(auto)';}}}
function onCustomMlChange(){onCustomPerfumeChange();}
function addCustomItem(){
  const pid=parseInt(document.getElementById('custom-perfume').value)||null;const ml=parseInt(document.getElementById('custom-ml').value)||null;
  const price=parseInt(document.getElementById('custom-price').value)||0;const qty=parseInt(document.getElementById('custom-qty').value)||1;const note=document.getElementById('custom-note').value.trim();
  if(!pid&&!ml){showToast('Select a perfume and size');return;}if(!price){showToast('Enter a price');return;}
  const perfume=pid?perfumes.find(x=>x.id===pid):null;const baseName=perfume?displayNameOf(perfume):'Custom';const sizePart=ml?' '+ml+'ml':'';const notePart=note?' ('+note+')':'';const itemName=baseName+sizePart+notePart;
  for(let i=0;i<qty;i++)order.push({pid:pid||'custom',size:ml,price,name:itemName,custom:true});
  updateBadge();
  document.getElementById('custom-perfume').value='';document.getElementById('custom-ml').value='';document.getElementById('custom-price').value='';document.getElementById('custom-qty').value='1';document.getElementById('custom-note').value='';document.getElementById('custom-auto-price').textContent='';
  renderOrder();showToast(itemName+' added!');
}
function addExtraNote(){const name=document.getElementById('extra-note-name').value.trim();const price=parseInt(document.getElementById('extra-note-price').value)||0;if(!name){showToast('Enter a note');return;}order.push({pid:'note',size:null,price,name,custom:true,isNote:true});updateBadge();document.getElementById('extra-note-name').value='';document.getElementById('extra-note-price').value='0';renderOrder();showToast('Added: '+name);}

function generateCard(){
  const sorted=[...perfumes].sort((a,b)=>displayNameOf(a).localeCompare(displayNameOf(b)));
  const today=new Date();const dateStr=today.getDate()+'-'+today.toLocaleString('en',{month:'short'})+'-'+String(today.getFullYear()).slice(2);
  const hasAnyOffer=sorted.some(p=>p.offer&&((p.offer.pct&&Object.values(p.offer.pct).some(v=>v>0))||(p.offer.manual&&Object.values(p.offer.manual).some(v=>v>0))));
  const ROW_H=30,HEADER_H=46,TITLE_H=56,W=1400,H=TITLE_H+HEADER_H+ROW_H*sorted.length+42;
  const canvas=document.getElementById('price-canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d');
  ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#1a1a1a';ctx.fillRect(0,0,W,TITLE_H);
  ctx.fillStyle='#c8a96e';ctx.font='bold 26px Georgia,serif';ctx.textAlign='left';ctx.fillText('FRAGRANZA',22,36);
  ctx.fillStyle='#888888';ctx.font='12px Arial,sans-serif';ctx.textAlign='center';ctx.fillText('DECANT PRICE LIST — All prices in BDT',W/2,36);
  ctx.fillStyle='#888888';ctx.textAlign='right';ctx.fillText('Last Updated: '+dateStr,W-18,36);
  const PAD=14,TABLE_X=PAD,TABLE_W=W-PAD*2,slW=40,offerW=hasAnyOffer?90:0,priceW=Math.floor((TABLE_W-slW-offerW)/6),nameW=TABLE_W-slW-priceW*5-offerW;
  const colX=[TABLE_X,TABLE_X+slW,TABLE_X+slW+nameW,TABLE_X+slW+nameW+priceW,TABLE_X+slW+nameW+priceW*2,TABLE_X+slW+nameW+priceW*3,TABLE_X+slW+nameW+priceW*4];
  if(hasAnyOffer)colX.push(TABLE_X+slW+nameW+priceW*5);
  const HEADERS=['SL','Name','2 ml','5 ml','10 ml','15 ml','30 ml'];if(hasAnyOffer)HEADERS.push('Offer');
  const colWidths=[slW,nameW,priceW,priceW,priceW,priceW,priceW];if(hasAnyOffer)colWidths.push(offerW);
  ctx.fillStyle='#2c2c2c';ctx.fillRect(TABLE_X,TITLE_H,TABLE_W,HEADER_H);
  ctx.fillStyle='#c8a96e';ctx.fillRect(TABLE_X,TITLE_H+HEADER_H-2,TABLE_W,2);
  HEADERS.forEach((h,i)=>{ctx.fillStyle=i===0?'#777':'#fff';ctx.font='bold 14px Arial,sans-serif';ctx.textAlign=i===1?'left':'center';ctx.fillText(h,i===1?colX[i]+12:colX[i]+colWidths[i]/2,TITLE_H+HEADER_H/2+5);});
  sorted.forEach((p,idx)=>{
    const ry=TITLE_H+HEADER_H+idx*ROW_H;
    ctx.fillStyle=idx%2===0?'#f8f7f4':'#ffffff';ctx.fillRect(TABLE_X,ry,TABLE_W,ROW_H);
    const badgeTxt=hasAnyOffer?offerBadgeText(p):'';
    if(hasAnyOffer&&badgeTxt){ctx.fillStyle='#fff3f3';ctx.fillRect(colX[colX.length-1],ry,offerW,ROW_H);}
    ctx.fillStyle='#aaaaaa';ctx.font='12px Arial,sans-serif';ctx.textAlign='center';ctx.fillText(String(idx+1),colX[0]+slW/2,ry+ROW_H/2+4);
    ctx.fillStyle=p.out?'#e05555':'#1a1a1a';ctx.textAlign='left';
    let dn=displayNameOf(p)+(p.out?' (Out)':'');ctx.font='13px Arial,sans-serif';
    while(ctx.measureText(dn).width>nameW-20&&dn.length>8)dn=dn.slice(0,-4)+'...';
    ctx.fillText(dn,colX[1]+12,ry+ROW_H/2+4);
    [2,5,10,15,30].forEach((s,si)=>{
      const pr=p.prices[s],ep=effectivePrice(p,s),cx=colX[si+2]+colWidths[si+2]/2;ctx.textAlign='center';
      if(ep!==pr){ctx.fillStyle='#bbbbbb';ctx.font='10px Arial,sans-serif';const ot=pr.toLocaleString();const tw=ctx.measureText(ot).width;ctx.fillText(ot,cx,ry+ROW_H/2-3);ctx.strokeStyle='#bbbbbb';ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(cx-tw/2,ry+ROW_H/2-6);ctx.lineTo(cx+tw/2,ry+ROW_H/2-6);ctx.stroke();ctx.fillStyle='#1a7a3a';ctx.font='bold 12px Arial,sans-serif';ctx.fillText(ep.toLocaleString(),cx,ry+ROW_H/2+10);}
      else{ctx.fillStyle=pr?'#333':'#ccc';ctx.font='14px Arial,sans-serif';ctx.fillText(pr?pr.toLocaleString():'—',cx,ry+ROW_H/2+4);}
    });
    if(hasAnyOffer&&badgeTxt){ctx.fillStyle='#cc3333';ctx.font='bold 12px Arial,sans-serif';ctx.textAlign='center';ctx.fillText(badgeTxt,colX[colX.length-1]+offerW/2,ry+ROW_H/2+4);}
    ctx.strokeStyle='#eae6de';ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(TABLE_X,ry+ROW_H);ctx.lineTo(TABLE_X+TABLE_W,ry+ROW_H);ctx.stroke();
  });
  ctx.strokeStyle='#dedad2';ctx.lineWidth=0.5;colX.slice(1).forEach(x=>{ctx.beginPath();ctx.moveTo(x,TITLE_H+HEADER_H);ctx.lineTo(x,TITLE_H+HEADER_H+sorted.length*ROW_H);ctx.stroke();});
  ctx.strokeStyle='#c8a96e';ctx.lineWidth=1.5;ctx.strokeRect(TABLE_X,TITLE_H,TABLE_W,HEADER_H+sorted.length*ROW_H);
  ctx.fillStyle='#aaaaaa';ctx.font='11px Arial,sans-serif';ctx.textAlign='center';ctx.fillText('Prices in BDT — Subject to change without prior notice — Fragranza Decant',W/2,TITLE_H+HEADER_H+sorted.length*ROW_H+22);
  const img=document.getElementById('card-img');img.src=canvas.toDataURL('image/png');
  document.getElementById('card-preview').style.display='block';document.getElementById('download-btn').disabled=false;showToast('Price card ready!');
}
function downloadCard(){generateCard();const canvas=document.getElementById('price-canvas');const link=document.createElement('a');link.download='Fragranza-Price-List-'+new Date().toISOString().slice(0,10)+'.png';link.href=canvas.toDataURL('image/png');link.click();showToast('Downloading...');}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2500);}

loadFromGitHub();
</script>
