<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fragranza" />
<title>Fragranza — Owner Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0a0a0a;
  --bg2: #141414;
  --bg3: #1e1e1e;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0ede8;
  --muted: #888;
  --accent: #c8a96e;
  --accent2: #e8c98e;
  --danger: #e05555;
  --success: #5c9e6a;
  --radius: 14px;
  --radius-sm: 8px;
  --tab-h: 64px;
  --header-h: 70px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  height: var(--header-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}

.logo {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 400;
  letter-spacing: 0.04em;
  color: var(--text);
}

.logo span { color: var(--accent); }

.cart-pill {
  background: var(--accent);
  color: #0a0a0a;
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  display: flex; align-items: center; gap: 6px;
  border: none;
  transition: background 0.2s;
}
.cart-pill:hover { background: var(--accent2); }
.cart-pill svg { width: 14px; height: 14px; }

/* Tabs */
.tabs {
  display: flex;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border);
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  position: sticky;
  top: var(--header-h);
  z-index: 99;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1;
  min-width: 80px;
  padding: 14px 8px;
  text-align: center;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 1.5px solid transparent;
  transition: all 0.2s;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  white-space: nowrap;
  border: none;
  background: none;
}
.tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Content */
.content {
  padding: 20px 16px;
  padding-bottom: calc(var(--tab-h) + 20px);
  max-width: 480px;
  margin: 0 auto;
}

/* Search */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-wrap svg {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  width: 16px; height: 16px;
}
.search-input {
  width: 100%;
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px 12px 40px;
  color: var(--text);
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  outline: none;
}
.search-input::placeholder { color: var(--muted); }
.search-input:focus { border-color: var(--border2); }

/* Perfume cards in catalog */
.p-card {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.p-card:active { border-color: var(--border2); }
.p-card.out-of-stock { opacity: 0.45; }

.p-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.p-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-weight: 400;
  color: var(--text);
  letter-spacing: 0.01em;
  flex: 1;
  line-height: 1.3;
}
.badge {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 99px;
  margin-left: 8px;
  white-space: nowrap;
  flex-shrink: 0;
  margin-top: 2px;
}
.badge-sale { background: rgba(200,169,110,0.15); color: var(--accent); border: 0.5px solid rgba(200,169,110,0.3); }
.badge-out { background: rgba(224,85,85,0.1); color: var(--danger); border: 0.5px solid rgba(224,85,85,0.3); }

.size-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.size-btn {
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 8px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
}
.size-btn:active { transform: scale(0.95); background: rgba(200,169,110,0.15); border-color: var(--accent); }
.size-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.size-ml { font-size: 13px; font-weight: 500; display: block; }
.size-price { font-size: 10px; color: var(--accent); display: block; margin-top: 2px; }

/* Order items */
.order-empty {
  text-align: center;
  padding: 60px 20px;
  color: var(--muted);
}
.order-empty svg { width: 48px; height: 48px; opacity: 0.3; margin-bottom: 16px; display: block; margin-left: auto; margin-right: auto; }
.order-empty p { font-size: 14px; }

.order-item {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 12px;
}
.oi-info { flex: 1; min-width: 0; }
.oi-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: 16px;
  font-weight: 400;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.oi-size { font-size: 12px; color: var(--muted); margin-top: 2px; }
.oi-price { font-size: 16px; font-weight: 500; color: var(--accent); white-space: nowrap; }
.oi-remove {
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 6px;
  border-radius: 6px;
  display: flex; align-items: center;
  transition: color 0.15s;
  flex-shrink: 0;
}
.oi-remove:active { color: var(--danger); }
.oi-remove svg { width: 16px; height: 16px; }

/* Summary */
.summary-box {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 12px;
}
.sum-title {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.sum-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0;
  border-bottom: 0.5px solid var(--border);
  font-size: 13px;
  color: var(--muted);
}
.sum-row:last-of-type { border-bottom: none; }
.sum-row span:last-child { color: var(--text); }
.sum-total {
  display: flex; justify-content: space-between; align-items: baseline;
  padding-top: 14px;
  margin-top: 8px;
  border-top: 0.5px solid var(--border2);
}
.sum-total-label { font-size: 14px; color: var(--muted); }
.sum-total-amt {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px;
  font-weight: 400;
  color: var(--accent);
}
.btn-clear {
  width: 100%;
  background: none;
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  margin-top: 10px;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-clear:active { border-color: var(--danger); color: var(--danger); }

.btn-copy {
  width: 100%;
  background: rgba(200,169,110,0.1);
  border: 0.5px solid rgba(200,169,110,0.3);
  border-radius: var(--radius-sm);
  padding: 12px;
  color: var(--accent);
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  cursor: pointer;
  margin-top: 8px;
  transition: all 0.2s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.btn-copy:active { background: rgba(200,169,110,0.2); }

/* Manage tab */
.section-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  margin-top: 20px;
}
.section-label:first-child { margin-top: 0; }

.manage-item {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  margin-bottom: 6px;
  overflow: hidden;
}
.manage-row {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 14px;
}
.manage-name {
  flex: 1;
  font-size: 14px;
  color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.m-btn {
  background: none;
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 5px 10px;
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.m-btn:active { border-color: var(--border2); color: var(--text); }
.m-btn.danger:active { border-color: var(--danger); color: var(--danger); }
.m-btn.out-active { border-color: rgba(224,85,85,0.4); color: var(--danger); }

.edit-prices {
  padding: 10px 14px 14px;
  border-top: 0.5px solid var(--border);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}
.edit-field label { font-size: 10px; color: var(--muted); display: block; margin-bottom: 4px; }
.edit-field input {
  width: 100%;
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 6px;
  color: var(--text);
  font-size: 12px;
  font-family: 'DM Sans', sans-serif;
  text-align: center;
  outline: none;
}
.edit-field input:focus { border-color: var(--accent); }

/* Add form */
.add-form {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 4px;
}
.add-form-name {
  width: 100%;
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  color: var(--text);
  font-size: 15px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  outline: none;
  margin-bottom: 10px;
}
.add-form-name::placeholder { color: var(--muted); }
.add-form-name:focus { border-color: var(--border2); }
.add-form-prices {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
  margin-bottom: 12px;
}
.add-form-prices .edit-field input { padding: 8px 4px; }
.btn-add {
  width: 100%;
  background: var(--accent);
  border: none;
  border-radius: var(--radius-sm);
  padding: 13px;
  color: #0a0a0a;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-add:active { background: var(--accent2); }


/* Delivery */
.delivery-box {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 10px;
}
.delivery-opts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.delivery-card {
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 10px;
  text-align: center;
}
.del-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.del-price { font-size: 18px; font-weight: 500; color: var(--accent); font-family: 'Cormorant Garamond', serif; }
.del-total { font-size: 11px; color: var(--muted); margin-top: 4px; }
.btn-copy-inside { background: rgba(92,158,106,0.1); border-color: rgba(92,158,106,0.3); color: #7ec98e; }
.btn-copy-inside:active { background: rgba(92,158,106,0.2); }
.btn-copy-outside { background: rgba(100,140,200,0.1); border-color: rgba(100,140,200,0.3); color: #8ab0e8; }
.btn-copy-outside:active { background: rgba(100,140,200,0.2); }



/* Bill summary lines */
.bill-line {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0;
  border-bottom: 0.5px solid var(--border);
}
.bill-line:last-of-type { border-bottom: none; }
.bill-line-total {
  padding-top: 10px;
  margin-top: 2px;
  border-bottom: none !important;
}
.bill-lbl { font-size: 13px; color: var(--muted); }
.bill-val { font-size: 14px; color: var(--text); font-weight: 500; }
.bill-total-amt {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--accent);
}
.bill-divider {
  border-top: 0.5px solid var(--border2);
  margin: 12px 0;
}

/* Advance & Due */
.advance-box {
  background: var(--bg2);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 10px;
}
.advance-row {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.advance-label { font-size: 13px; color: var(--muted); flex: 1; }
.advance-input {
  width: 130px;
  background: var(--bg3);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  color: var(--accent);
  font-size: 16px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  text-align: right;
  outline: none;
  flex-shrink: 0;
}
.advance-input:focus { border-color: var(--accent); }
.due-row {
  display: flex; justify-content: space-between; align-items: baseline;
  background: var(--bg3);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  margin-top: 4px;
}
.due-label { font-size: 13px; color: var(--muted); }
.due-amount {
  font-family: 'Cormorant Garamond', serif;
  font-size: 26px;
  font-weight: 400;
}
.due-amount.positive { color: #e05555; }
.due-amount.zero { color: var(--success); }
.due-amount.overpaid { color: #8ab0e8; }

/* Toast */
.toast {
  position: fixed;
  bottom: calc(var(--tab-h) + 16px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: 99px;
  padding: 10px 20px;
  font-size: 13px;
  color: var(--text);
  opacity: 0;
  transition: all 0.25s;
  pointer-events: none;
  white-space: nowrap;
  z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Quantity control in order */
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qty-btn {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--bg3);
  border: 0.5px solid var(--border);
  color: var(--text);
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0; line-height: 1;
}
.qty-num { font-size: 14px; min-width: 16px; text-align: center; }

/* Page hidden class */
.page { display: none; }
.page.active { display: block; }

/* No results */

.copy-price-btn {
  background: none;
  border: 0.5px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 9px;
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  flex-shrink: 0;
  transition: all 0.15s;
}
.copy-price-btn:active { border-color: var(--accent); color: var(--accent); }

.no-results { text-align: center; padding: 40px 0; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<header class="header">
  <div class="logo">Frag<span>ranza</span> <span style="font-size:11px;font-family:'DM Sans',sans-serif;background:rgba(200,169,110,0.15);color:var(--accent);border:0.5px solid rgba(200,169,110,0.3);border-radius:99px;padding:2px 8px;vertical-align:middle;letter-spacing:0.06em;">OWNER</span></div>
  <button class="cart-pill" onclick="goTab('order')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    <span id="cart-count">0</span> items
  </button>
</header>

<nav class="tabs">
  <button class="tab active" onclick="goTab('catalog')" id="tab-catalog">Catalog</button>
  <button class="tab" onclick="goTab('order')" id="tab-order">Order</button>
  <button class="tab" onclick="goTab('manage')" id="tab-manage">Manage</button>
  <button class="tab" onclick="goTab('pricecard')" id="tab-pricecard">Price Card</button>
</nav>

<main class="content">

  <!-- CATALOG -->
  <div class="page active" id="page-catalog">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Search perfumes…" oninput="renderCatalog()" autocomplete="off" />
    </div>
    <div id="catalog"></div>
  </div>

  <!-- ORDER -->
  <div class="page" id="page-order">
    <div id="order-list"></div>
    <div id="order-summary"></div>
  </div>

  <!-- MANAGE -->
  <div class="page" id="page-manage">
    <p class="section-label">Stock & Prices</p>
    <div id="manage-list"></div>
    <p class="section-label">Add New Perfume</p>
    <div class="add-form">
      <input class="add-form-name" type="text" id="new-name" placeholder="Perfume name…" autocomplete="off" />
      <div class="add-form-prices" id="add-price-fields"></div>
      <button class="btn-add" onclick="addPerfume()">Add Perfume</button>
    </div>
  </div>

  <!-- PRICE CARD -->
  <div class="page" id="page-pricecard">
    <p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.6;">Generate a price list image you can download and post to social media. Automatically includes all your current perfumes.</p>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">
      <button class="btn-add" id="generate-btn" onclick="generateCard()" style="flex:1;padding:13px;min-width:140px;">Generate Image</button>
      <button class="btn-add" id="download-btn" onclick="downloadCard()" style="flex:1;padding:13px;min-width:140px;background:rgba(200,169,110,0.15);color:var(--accent);border:0.5px solid rgba(200,169,110,0.3);" disabled>Download</button>
    </div>
    <div id="card-preview" style="display:none;margin-top:8px;">
      <p style="font-size:11px;color:var(--muted);margin-bottom:8px;letter-spacing:0.06em;text-transform:uppercase;">Preview</p>
      <img id="card-img" style="width:100%;border-radius:var(--radius);border:0.5px solid var(--border);" />
    </div>
    <canvas id="price-canvas" style="display:none;"></canvas>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
const SIZES = [2, 5, 10, 15, 30];

let perfumes = [
  { id:1, name:'Hawas Ice', prices:{2:100,5:260,10:440,15:640,30:1320}, out:false, sale:false },
  { id:2, name:'Rayhaan Tropical Vibe', prices:{2:80,5:180,10:340,15:480,30:1000}, out:false, sale:false },
  { id:3, name:'Supremacy Collector\'s', prices:{2:200,5:460,10:820,15:1180,30:2480}, out:false, sale:false },
  { id:4, name:'Rayhaan Aquatica', prices:{2:126,5:270,10:513,15:747,30:1350}, out:false, sale:true },
  { id:5, name:'Hawas Black', prices:{2:100,5:240,10:420,15:600,30:1240}, out:false, sale:false },

/* ---- NAV ---- */
function goTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');

/* ---- CATALOG ---- */
function renderCatalog() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  const el = document.getElementById('catalog');
  const list = perfumes.filter(p => p.name.toLowerCase().includes(q)).sort((a,b) => a.name.localeCompare(b.name));
  if (!list.length) { el.innerHTML = '<div class="no-results">No perfumes found</div>'; return; }

    const badges = (p.sale ? '<span class="badge badge-sale">SALE</span>' : '') + (p.out ? '<span class="badge badge-out">OUT</span>' : '');
    const btns = SIZES.map(s => {
      const pr = p.prices[s];
      if (!pr && pr !== 0) return `<div></div>`;
      return `<button class="size-btn" onclick="addToOrder(${p.id},${s})" ${p.out ? 'disabled' : ''}>
        <span class="size-ml">${s}ml</span>
        <span class="size-price">৳${pr.toLocaleString()}</span>

  const p = perfumes.find(x => x.id === pid);
  if (!p || p.out) return;
  order.push({ pid, size, price: p.prices[size], name: p.name });
  updateBadge();
  showToast(p.name.split(' ')[0] + ' ' + size + 'ml added');
}

let selectedDelivery = 'none';

function selectDelivery(type) {
  selectedDelivery = type;
  ['none','inside','outside'].forEach(t => {
    const c = document.getElementById('del-card-' + t);
    if (c) c.style.borderColor = t === type ? 'var(--accent)' : 'var(--border)';
  });
  recalc();
}

function recalc() {
  const perfumeTotal = order.reduce((s, o) => s + o.price, 0);
  const delAmt = selectedDelivery === 'inside' ? 85 : selectedDelivery === 'outside' ? 125 : 0;
  const grandTotal = perfumeTotal + delAmt;
  currentGrandTotal = grandTotal;

  // delivery row
  const delRow = document.getElementById('bb-del-row');
  const delLbl = document.getElementById('bb-del-lbl');
  const delVal = document.getElementById('bb-del-val');
  if (delRow) {
    if (delAmt > 0) {
      delRow.style.display = 'flex';
      delLbl.textContent = selectedDelivery === 'inside' ? '🛵 Inside Dhaka' : '🚚 Outside Dhaka';
      delVal.textContent = '৳' + delAmt.toLocaleString();
    } else {
      delRow.style.display = 'none';
    }
  }
  const bbTotal = document.getElementById('bb-total');
  if (bbTotal) bbTotal.textContent = '৳' + grandTotal.toLocaleString();

  // advance & due
  const advEl = document.getElementById('advance-input');
  const advance = advEl ? (parseFloat(advEl.value) || 0) : 0;
  const dueSection = document.getElementById('due-section');
  const copyTxBtn = document.getElementById('copy-transaction-btn');
  if (advance > 0) {
    const due = grandTotal - advance;
    if (dueSection) dueSection.style.display = 'block';
    if (copyTxBtn) copyTxBtn.style.display = 'flex';
    const dueBillTotal = document.getElementById('due-bill-total');
    const dueAdv = document.getElementById('due-adv');
    const dueFinal = document.getElementById('due-final');
    if (dueBillTotal) dueBillTotal.textContent = '৳' + grandTotal.toLocaleString();
    if (dueAdv) dueAdv.textContent = '- ৳' + advance.toLocaleString();
    if (dueFinal) {
      dueFinal.textContent = '৳' + Math.abs(due).toLocaleString() + (due < 0 ? ' (Overpaid)' : due === 0 ? ' (Settled)' : '');
      dueFinal.style.color = due < 0 ? '#8ab0e8' : due === 0 ? 'var(--success)' : '#e05555';
    }
  } else {
    if (dueSection) dueSection.style.display = 'none';
    if (copyTxBtn) copyTxBtn.style.display = 'none';
  }
}

function getOrderLines() {
  const map = {};
  order.forEach(o => {
    const k = o.pid + '-' + o.size;
    if (!map[k]) map[k] = { name: o.name, size: o.size, price: o.price, qty: 0 };
    map[k].qty++;
  });
  return Object.values(map).map(g =>
    `• ${g.name} ${g.size}ml${g.qty > 1 ? ' ×' + g.qty : ''} — ৳${(g.price * g.qty).toLocaleString()}`
  );
}

function copyFull() {
  if (!order.length) return;
  const perfumeTotal = order.reduce((s, o) => s + o.price, 0);
  const totalMl = order.reduce((s, o) => s + o.size, 0);
  const delAmt = selectedDelivery === 'inside' ? 85 : selectedDelivery === 'outside' ? 125 : 0;
  const grandTotal = perfumeTotal + delAmt;
  const delLine = delAmt > 0 ? `\nDelivery (${selectedDelivery === 'inside' ? 'Inside Dhaka' : 'Outside Dhaka'}): ৳${delAmt}` : '';
  const lines = getOrderLines();
  const text = `*Fragranza Order*\n\n${lines.join('\n')}\n\nPerfume Total: ৳${perfumeTotal.toLocaleString()}${delLine}\n\nTotal Bill: ৳${grandTotal.toLocaleString()}`;
  navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => showToast('Could not copy'));
}

function copyWithTransaction() {
  if (!order.length) return;
  const perfumeTotal = order.reduce((s, o) => s + o.price, 0);
  const totalMl = order.reduce((s, o) => s + o.size, 0);
  const delAmt = selectedDelivery === 'inside' ? 85 : selectedDelivery === 'outside' ? 125 : 0;
  const grandTotal = perfumeTotal + delAmt;
  const advance = parseFloat(document.getElementById('advance-input').value) || 0;
  const due = grandTotal - advance;
  const delLine = delAmt > 0 ? `\nDelivery (${selectedDelivery === 'inside' ? 'Inside Dhaka' : 'Outside Dhaka'}): ৳${delAmt}` : '';
  const lines = getOrderLines();
  const text = `*Fragranza Order*\n\n${lines.join('\n')}\n\nPerfume Total: ৳${perfumeTotal.toLocaleString()}${delLine}\nTotal Bill: ৳${grandTotal.toLocaleString()}\n\nAdvance Paid: ৳${advance.toLocaleString()}\nDue Bill: ৳${Math.abs(due).toLocaleString()}${due < 0 ? ' (Overpaid)' : due === 0 ? ' (Settled)' : ''}`;
  navigator.clipboard.writeText(text).then(() => showToast('Copied!')).catch(() => showToast('Could not copy'));
}

/* ---- MANAGE ---- */
function renderManage() {
  const el = document.getElementById('manage-list');
  el.innerHTML = [...perfumes].sort((a,b) => a.name.localeCompare(b.name)).map(p => {
    const editing = editingId === p.id;
    const editBlock = editing ? `<div class="edit-prices">${SIZES.map(s =>
      `<div class="edit-field"><label>${s}ml</label><input type="number" min="0" value="${p.prices[s] || ''}" oninput="setPr(${p.id},${s},this.value)" inputmode="numeric" /></div>`
    ).join('')}</div>` : '';
    return `<div class="manage-item">
      <div class="manage-row">
        <span class="manage-name">${esc(p.name)}</span>
        <button class="m-btn" onclick="toggleEdit(${p.id})">${editing ? 'Done' : 'Prices'}</button>
        <button class="m-btn ${p.out ? 'out-active' : ''}" onclick="toggleOut(${p.id})">${p.out ? 'Out' : 'In stock'}</button>
        <button class="m-btn danger" onclick="deletePerfume(${p.id})">✕</button>
      </div>
      ${editBlock}
    </div>`;
  }).join('');

  // Build add price fields
  const pf = document.getElementById('add-price-fields');
  pf.innerHTML = SIZES.map(s =>
    `<div class="edit-field"><label>${s}ml ৳</label><input type="number" min="0" id="new-${s}" placeholder="0" inputmode="numeric" /></div>`
  ).join('');
}

function toggleEdit(id) {
  editingId = editingId === id ? null : id;
  renderManage();
}

function setPr(id, size, val) {
  const p = perfumes.find(x => x.id === id);
  if (p) { p.prices[size] = parseInt(val) || 0; }
}

function toggleOut(id) {
  const p = perfumes.find(x => x.id === id);
  if (p) { p.out = !p.out; renderManage(); renderCatalog(); }
}

function deletePerfume(id) {
  if (!confirm('Delete this perfume?')) return;
  perfumes = perfumes.filter(x => x.id !== id);
  order = order.filter(o => o.pid !== id);
  updateBadge();
  renderManage();
  renderCatalog();
}

function addPerfume() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { showToast('Enter a perfume name'); return; }
  const prices = {};
  SIZES.forEach(s => { prices[s] = parseInt(document.getElementById('new-' + s).value) || 0; });
  perfumes.push({ id: nextId++, name, prices, out: false, sale: false });
  document.getElementById('new-name').value = '';
  SIZES.forEach(s => { document.getElementById('new-' + s).value = ''; });
  showToast(name + ' added!');
  renderManage();
  renderCatalog();
}

/* ---- PRICE CARD ---- */
function generateCard() {
  // Filter out out-of-stock perfumes
  const sorted = [...perfumes].sort((a,b) => a.name.localeCompare(b.name));
  const today = new Date();
  const dateStr = today.getDate() + '-' + today.toLocaleString('en',{month:'short'}) + '-' + String(today.getFullYear()).slice(2);

  // Facebook landscape 2026: 1200x630 (1.91:1)
  const W = 1200;
  const H = 630;
  const SIZES = [2, 5, 10, 15, 30];

  const canvas = document.getElementById('price-canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');

  // ── Background ──────────────────────────────────────────────────
  ctx.fillStyle = '#f5f3ef';
  ctx.fillRect(0, 0, W, H);

  // Left dark sidebar — slim
  const SIDEBAR_W = 72;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(0, 0, SIDEBAR_W, H);

  // Gold accent line
  ctx.fillStyle = '#c8a96e';
  ctx.fillRect(SIDEBAR_W - 3, 0, 3, H);

  // ── Brand in sidebar ────────────────────────────────────────────
  ctx.save();
  ctx.translate(SIDEBAR_W/2, H/2);
  ctx.rotate(-Math.PI/2);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.fillText('FRAGRANZA', 0, 0);
  ctx.restore();

  ctx.fillStyle = '#c8a96e';
  ctx.font = 'bold 8px Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('2026', SIDEBAR_W/2, H - 16);

  // ── Table area ──────────────────────────────────────────────────
  const TABLE_X = SIDEBAR_W + 6;
  const TABLE_W = W - TABLE_X - 8;
  const TABLE_Y = 8;

  // Title row
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(TABLE_X, TABLE_Y, TABLE_W, 46);

  // Headers
  const COLS = ['Perfume Name', '2 ml', '5 ml', '10 ml', '15 ml', '30 ml', 'Offer'];
  const COL_W = [220, 78, 78, 78, 78, 78, 90];
  const totalCols = COL_W.reduce((a,b)=>a+b,0);
  const scaleX = TABLE_W / totalCols;
  const scaledW = COL_W.map(w => Math.round(w * scaleX));

  // Fix rounding
  const diff = TABLE_W - scaledW.reduce((a,b)=>a+b,0);
  scaledW[0] += diff;

  let hx = TABLE_X;
  COLS.forEach((h, i) => {
    ctx.fillStyle = i === 6 ? '#c8a96e' : '#f0ede8';
    ctx.font = 'bold 17px Arial, sans-serif';
    ctx.textAlign = i === 0 ? 'left' : 'center';
    const tx = i === 0 ? hx + 10 : hx + scaledW[i]/2;
    ctx.fillText(h, tx, TABLE_Y + 30);
    hx += scaledW[i];
  });

  // ── Rows ─────────────────────────────────────────────────────────
  const availH = H - TABLE_Y - 46 - 30; // 30 for footer
  const ROW_H = Math.min(Math.floor(availH / sorted.length), 44);
  const startY = TABLE_Y + 46;

  sorted.forEach((p, rowIdx) => {
    const ry = startY + rowIdx * ROW_H;
    const isEven = rowIdx % 2 === 0;

    // Row bg
    ctx.fillStyle = isEven ? '#f9f8f5' : '#ffffff';
    ctx.fillRect(TABLE_X, ry, TABLE_W, ROW_H);

    // Offer column highlight
    if (p.sale) {
      const offerX = TABLE_X + scaledW.slice(0,-1).reduce((a,b)=>a+b,0);
      ctx.fillStyle = '#fff0f0';
      ctx.fillRect(offerX, ry, scaledW[6], ROW_H);
    }

    let cx = TABLE_X;

    // Name cell — red if out of stock
    ctx.fillStyle = p.out ? '#ee6b6e' : '#1a1a1a';
    ctx.textAlign = 'left';
    const nameStr = p.name + (p.out ? ' (Out)' : '');
    const maxNameW = scaledW[0] - 20;
    ctx.font = '13px Arial, sans-serif';
    if (ctx.measureText(nameStr).width > maxNameW) {
      const words = nameStr.split(' ');
      let l1 = '', l2 = '';
      let done = false;
      ctx.font = '13px Arial, sans-serif';
      words.forEach(w => {
        if (!done && ctx.measureText(l1+w+' ').width < maxNameW) l1 += w+' ';
        else { done=true; l2+=w+' '; }
      });
      ctx.font = '14px Arial, sans-serif';
      ctx.fillText(l1.trim(), cx+10, ry + ROW_H/2 - 5);
      ctx.fillText(l2.trim(), cx+10, ry + ROW_H/2 + 11);
    } else {
      ctx.font = '16px Arial, sans-serif';
      ctx.fillText(nameStr, cx+10, ry + ROW_H/2 + 4);
    }
    cx += scaledW[0];

    // Price cells
    SIZES.forEach((s, si) => {
      const pr = p.prices[s];
      ctx.fillStyle = pr ? '#333333' : '#cccccc';
      ctx.font = '16px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(pr ? pr.toLocaleString() : '-', cx + scaledW[si+1]/2, ry + ROW_H/2 + 4);
      cx += scaledW[si+1];
    });

    // Offer cell
    if (p.sale) {
      ctx.fillStyle = '#cc3333';
      ctx.font = 'bold 15px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('10% OFF', cx + scaledW[6]/2, ry + ROW_H/2 + 4);
    }

    // Row divider
    ctx.strokeStyle = '#e4e0d8';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(TABLE_X, ry + ROW_H);
    ctx.lineTo(TABLE_X + TABLE_W, ry + ROW_H);
    ctx.stroke();
  });

  // Column dividers
  ctx.strokeStyle = '#dedad2';
  ctx.lineWidth = 0.5;
  let dvx = TABLE_X + scaledW[0];
  for (let i = 1; i < scaledW.length; i++) {
    ctx.beginPath();
    ctx.moveTo(dvx, TABLE_Y + 46);
    ctx.lineTo(dvx, startY + sorted.length * ROW_H);
    ctx.stroke();
    dvx += scaledW[i];
  }

  // Table border
  ctx.strokeStyle = '#c8a96e';
  ctx.lineWidth = 1;
  ctx.strokeRect(TABLE_X, TABLE_Y, TABLE_W, sorted.length * ROW_H + 46);

  // ── Footer ───────────────────────────────────────────────────────
  const footerY = H - 24;
  ctx.fillStyle = '#999999';
  ctx.font = '10px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('Prices in BDT — Subject to change without prior notice', TABLE_X, footerY);
  ctx.textAlign = 'right';
  ctx.fillText('Last Updated: ' + dateStr, W - 14, footerY);

  // Show preview
  const img = document.getElementById('card-img');
  img.src = canvas.toDataURL('image/png');
  document.getElementById('card-preview').style.display = 'block';
  document.getElementById('download-btn').disabled = false;
  showToast('Image generated!');
}

function downloadCard() {
  generateCard();
  const canvas = document.getElementById('price-canvas');
  const link = document.createElement('a');
  link.download = 'Fragranza-Price-List-' + new Date().toISOString().slice(0,10) + '.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  showToast('Downloading...');
}


function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* ---- INIT ---- */
renderCatalog();
renderManage();
</script>
