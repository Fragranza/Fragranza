<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<meta name="theme-color" content="#0a0a0a" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Fragranza — Price List</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0a0a0a;--bg2:#141414;--bg3:#1e1e1e;--border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);--text:#f0ede8;--muted:#888;--accent:#c8a96e;--accent2:#e8c98e;--danger:#e05555;--success:#5c9e6a;--radius:14px;--radius-sm:8px;--header-h:64px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh;}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:0.5px solid var(--border);height:var(--header-h);display:flex;align-items:center;justify-content:space-between;padding:0 20px;backdrop-filter:blur(20px);}
.logo{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:400;letter-spacing:0.04em;}
.logo span{color:var(--accent);}
.tagline{font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
.cart-pill{background:var(--accent);color:#0a0a0a;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px;border:none;transition:background 0.2s;}
.cart-pill:active{background:var(--accent2);}
.cart-pill svg{width:14px;height:14px;}

/* Tabs */
.tabs{display:flex;background:var(--bg);border-bottom:0.5px solid var(--border);position:sticky;top:var(--header-h);z-index:99;}
.tab{flex:1;padding:13px 8px;text-align:center;font-size:12px;font-weight:400;color:var(--muted);cursor:pointer;border-bottom:1.5px solid transparent;transition:all 0.2s;letter-spacing:0.06em;text-transform:uppercase;border:none;background:none;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}

.content{padding:16px 16px 60px;max-width:480px;margin:0 auto;}

/* Search */
.search-wrap{position:relative;margin-bottom:12px;}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px;}
.search-input{width:100%;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px 11px 40px;color:var(--text);font-size:15px;font-family:'DM Sans',sans-serif;font-weight:300;outline:none;}
.search-input::placeholder{color:var(--muted);}
.search-input:focus{border-color:var(--border2);}

/* Filter */
.filter-row{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none;}
.filter-row::-webkit-scrollbar{display:none;}
.filter-btn{background:var(--bg2);border:0.5px solid var(--border);border-radius:99px;padding:6px 14px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:all 0.15s;}
.filter-btn.active{background:rgba(200,169,110,0.12);border-color:rgba(200,169,110,0.4);color:var(--accent);}

/* Perfume cards */

.p-display-name { font-family: 'Cormorant Garamond', serif; font-size: 19px; font-weight: 400; color: var(--text); letter-spacing: 0.01em; line-height: 1.3; }
.fragrantica-link { font-size: 11px; color: var(--muted); margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; opacity: 0.7; transition: opacity 0.15s; }
.fragrantica-link:active { opacity: 1; color: var(--accent); }

.p-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.p-card.out-of-stock{opacity:0.45;}
.p-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px;gap:8px;}
.p-name{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:400;color:var(--text);letter-spacing:0.01em;line-height:1.3;flex:1;}
.badges{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:10px;font-weight:500;letter-spacing:0.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.badge-sale{background:rgba(200,169,110,0.15);color:var(--accent);border:0.5px solid rgba(200,169,110,0.3);}
.badge-out{background:rgba(224,85,85,0.1);color:var(--danger);border:0.5px solid rgba(224,85,85,0.3);}

/* Size buttons */
.size-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.size-btn{background:var(--bg3);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:9px 4px;text-align:center;cursor:pointer;transition:all 0.15s;color:var(--text);font-family:'DM Sans',sans-serif;}
.size-btn:active{transform:scale(0.95);background:rgba(200,169,110,0.15);border-color:var(--accent);}
.size-btn:disabled{opacity:0.3;cursor:not-allowed;}
.size-ml{font-size:12px;font-weight:500;display:block;}
.size-price{font-size:10px;color:var(--accent);display:block;margin-top:2px;}

/* Order tab */
.order-empty{text-align:center;padding:60px 20px;color:var(--muted);}
.order-empty svg{width:48px;height:48px;opacity:0.3;display:block;margin:0 auto 16px;}
.order-empty p{font-size:14px;}
.order-item{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.oi-info{flex:1;min-width:0;}
.oi-name{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.oi-size{font-size:12px;color:var(--muted);margin-top:2px;}
.oi-price{font-size:15px;font-weight:500;color:var(--accent);white-space:nowrap;}
.oi-remove{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;border-radius:6px;display:flex;align-items:center;flex-shrink:0;}
.oi-remove:active{color:var(--danger);}
.oi-remove svg{width:16px;height:16px;}

/* Summary box */
.summary-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;margin-top:12px;}
.sum-title{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.sum-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border);font-size:13px;color:var(--muted);}
.sum-row:last-of-type{border-bottom:none;}
.sum-row span:last-child{color:var(--text);}
.sum-total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:6px;border-top:0.5px solid var(--border2);}
.sum-total-label{font-size:14px;color:var(--muted);}
.sum-total-amt{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;color:var(--accent);}

/* Step labels */
.step-label{font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}

/* Delivery cards */
.delivery-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.delivery-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px 6px;text-align:center;cursor:pointer;transition:border-color 0.15s;}
.del-label{font-size:10px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;}
.del-price{font-size:16px;font-weight:500;color:var(--accent);font-family:'Cormorant Garamond',serif;}

/* Bill */
.bill-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--radius);padding:14px;}
.bb-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px;}
.bb-row:last-child{border-bottom:none;}
.bb-lbl{color:var(--muted);}
.bb-val{color:var(--text);font-weight:500;}
.bb-total-row{padding-top:10px;}
.bb-total-lbl{font-size:14px;font-weight:500;color:var(--text);}
.bb-total-val{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--accent);}

/* Buttons */
.btn-copy{width:100%;background:rgba(200,169,110,0.1);border:0.5px solid rgba(200,169,110,0.3);border-radius:var(--radius-sm);padding:14px;color:var(--accent);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:500;transition:all 0.2s;}
.btn-copy:active{background:rgba(200,169,110,0.2);}
.btn-messenger{width:100%;background:rgba(0,132,255,0.12);border:0.5px solid rgba(0,132,255,0.3);border-radius:var(--radius-sm);padding:14px;color:#4a9eff;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;transition:all 0.2s;}
.btn-messenger:active{background:rgba(0,132,255,0.2);}
.btn-clear{width:100%;background:none;border:0.5px solid var(--border);border-radius:var(--radius-sm);padding:12px;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;}
.btn-clear:active{border-color:var(--danger);color:var(--danger);}

.bkash-box { background: rgba(220,55,100,0.08); border: 0.5px solid rgba(220,55,100,0.25); border-radius: var(--radius-sm); padding: 14px; margin-top: 10px; }
.bkash-title { font-size: 13px; font-weight: 500; color: #e85580; margin-bottom: 6px; }
.bkash-note { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 10px; }
.bkash-number { font-size: 18px; font-weight: 500; color: var(--text); letter-spacing: 0.05em; margin-bottom: 10px; font-family: 'Cormorant Garamond', serif; }
.btn-bkash { width: 100%; background: rgba(220,55,100,0.12); border: 0.5px solid rgba(220,55,100,0.3); border-radius: var(--radius-sm); padding: 10px; color: #e85580; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; font-weight: 500; }
.btn-bkash:active { background: rgba(220,55,100,0.2); }

.fb-note{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;line-height:1.6;}

/* Loading */

.price-original { text-decoration: line-through; color: var(--muted); font-size: 9px; display: block; }
.offer-badge-sm { font-size: 9px; color: #7ec98e; display: block; margin-top: 1px; }
.badge-offer { background: rgba(92,158,106,0.15); color: #7ec98e; border: 0.5px solid rgba(92,158,106,0.3); }

.loading{text-align:center;padding:60px 20px;color:var(--muted);}
.loading svg{width:36px;height:36px;opacity:0.3;display:block;margin:0 auto 12px;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading p{font-size:14px;}
.no-results{text-align:center;padding:40px 0;color:var(--muted);font-size:14px;}
.count-label{font-size:12px;color:var(--muted);margin-bottom:12px;}
.footer-note{text-align:center;font-size:11px;color:var(--muted);padding:20px 0 0;line-height:1.8;}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:0.5px solid var(--border2);border-radius:99px;padding:10px 20px;font-size:13px;color:var(--text);opacity:0;transition:all 0.25s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

.page{display:none;}
.page.active{display:block;}
</style>
</head>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>

<nav class="tabs">
  <button class="tab active" onclick="goTab('catalog')" id="tab-catalog">Price List</button>
  <button class="tab" onclick="goTab('order')" id="tab-order">My Order</button>
</nav>

<main class="content">
  <!-- CATALOG -->
  <div class="page active" id="page-catalog">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input class="search-input" type="text" id="search" placeholder="Search perfumes..." oninput="renderCatalog()" autocomplete="off" />
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all')" id="f-all">All</button>
      <button class="filter-btn" onclick="setFilter('available')" id="f-available">Available</button>
      <button class="filter-btn" onclick="setFilter('sale')" id="f-sale">On Sale</button>
      <button class="filter-btn" onclick="setFilter('out')" id="f-out">Out of Stock</button>
    </div>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setGenderFilter('all')" id="gf-all">All</button>
      <button class="filter-btn" onclick="setGenderFilter('male')" id="gf-male">Male</button>
      <button class="filter-btn" onclick="setGenderFilter('female')" id="gf-female">Female</button>
      <button class="filter-btn" onclick="setGenderFilter('unisex')" id="gf-unisex">Unisex</button>
    </div>
    <div id="catalog">
      <div class="loading">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <p>Loading price list...</p>
      </div>
    </div>
    <div class="footer-note">All prices in BDT — Subject to change without notice</div>
  </div>

  <!-- ORDER -->
  <div class="page" id="page-order">
    <div id="order-list"></div>
    <div id="order-summary"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const GH_RAW = 'https://raw.githubusercontent.com/Fragranza/Fragranza/main/perfumes.json';
const SIZES = [2,5,10,15,30];
let perfumes = [];
let order = [];
let activeFilter = 'all';
let genderFilter = 'all';
let selectedDelivery = 'none';
let currentGrandTotal = 0;

// ── Load data ────────────────────────────────────────────────────────────────
async function loadPerfumes() {
  try {
    const r = await fetch(GH_RAW + '?t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    perfumes = data.map(p => ({
      ...p,
      prices: {2:p.prices['2']||0, 5:p.prices['5']||0, 10:p.prices['10']||0, 15:p.prices['15']||0, 30:p.prices['30']||0},
      offer: p.offer ? { pct: p.offer.pct || {}, manual: p.offer.manual || {} } : null,
      gender: p.gender || 'male',
      displayName: p.displayName || p.name,
      fragrantica: p.fragrantica || ''
    }));
    renderCatalog();
  } catch(e) {
    document.getElementById('catalog').innerHTML = '<div class="no-results">Could not load price list.<br>Please try again later.</div>';
  }
}

// ── Navigation ───────────────────────────────────────────────────────────────
function goTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('page-' + name).classList.add('active');
  if (name === 'order') renderOrder();
}

// ── Catalog ──────────────────────────────────────────────────────────────────
function setGenderFilter(g) {
  genderFilter = g;
  ['all','male','female','unisex'].forEach(f => {
    const b = document.getElementById('gf-' + f);
    if (b) b.classList.toggle('active', f === g);
  });
  renderCatalog();
}

function setFilter(f) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('f-' + f).classList.add('active');
  renderCatalog();
}

function renderCatalog() {
  const q = (document.getElementById('search').value || '').toLowerCase();
  let list = [...perfumes].sort((a,b) => a.name.localeCompare(b.name));
  if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
  if (activeFilter === 'available') list = list.filter(p => !p.out);
  if (activeFilter === 'sale') list = list.filter(p => p.sale);
  if (activeFilter === 'out') list = list.filter(p => p.out);
  if (genderFilter !== 'all') list = list.filter(p => (p.gender || 'male') === genderFilter);
  const el = document.getElementById('catalog');
  if (!list.length) { el.innerHTML = '<div class="no-results">No perfumes found</div>'; return; }
  el.innerHTML = '<div class="count-label">' + list.length + ' perfume' + (list.length !== 1 ? 's' : '') + '</div>' +
    list.map(p => {
      const badges = (p.offer ? '<span class="badge badge-offer">' + offerBadgeText(p) + '</span>' : '') + (p.sale ? '<span class="badge badge-sale">Sale</span>' : '') + (p.out ? '<span class="badge badge-out">Out of Stock</span>' : '');
      const btns = SIZES.map(s => {
        const pr = p.prices[s];
        if (!pr || pr === 0) return '<div></div>';
        return '<button class="size-btn" onclick="addToOrder(' + p.id + ',' + s + ')" ' + (p.out ? 'disabled' : '') + '>' +
          '<span class="size-ml">' + s + 'ml</span>' +
          '<span class="size-price">' + (pr > 0 ? '৳' + pr.toLocaleString() : '—') + '</span>' +
          '</button>';
      }).join('');
      const fragLink = p.fragrantica
        ? '<a href="' + p.fragrantica + '" target="_blank" rel="noopener" class="fragrantica-link">' +
            '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>' +
            'View on Fragrantica</a>'
        : '';
      return '<div class="p-card ' + (p.out ? 'out-of-stock' : '') + '">' +
        '<div class="p-header">' +
          '<div style="flex:1;min-width:0;">' +
            '<div class="p-display-name">' + esc(p.displayName || p.name) + '</div>' +
            fragLink +
          '</div>' +
          (badges ? '<div class="badges" style="flex-shrink:0;">' + badges + '</div>' : '') +
        '</div>' +
        '<div class="size-grid">' + btns + '</div></div>';
    }).join('');
}

// ── Order ────────────────────────────────────────────────────────────────────
function addToOrder(pid, size) {
  const p = perfumes.find(x => x.id === pid);
  if (!p || p.out) return;
  order.push({ pid, size, price: effectivePrice(p, size), name: p.name });
  updateBadge();
  showToast(p.name.split(' ')[0] + ' ' + size + 'ml added');
}

function removeFromOrder(idx) {
  order.splice(idx, 1);
  updateBadge();
  renderOrder();
}

function clearOrder() {
  order = [];
  selectedDelivery = 'none';
  updateBadge();
  renderOrder();
}

function updateBadge() {
  document.getElementById('cart-count').textContent = order.length;
}

function selectDelivery(type) {
  selectedDelivery = type;
  ['none','inside','outside'].forEach(t => {
    const c = document.getElementById('del-' + t);
    if (c) c.style.borderColor = t === type ? 'var(--accent)' : 'var(--border)';
  });
  recalc();
}

function recalc() {
  const perfumeTotal = order.reduce((s,o) => s + o.price, 0);
  const delAmt = selectedDelivery === 'inside' ? 85 : selectedDelivery === 'outside' ? 125 : 0;
  currentGrandTotal = perfumeTotal + delAmt;

  const delRow = document.getElementById('bb-del-row');
  const delLbl = document.getElementById('bb-del-lbl');
  const delVal = document.getElementById('bb-del-val');
  if (delRow) {
    if (delAmt > 0) {
      delRow.style.display = 'flex';
      delLbl.textContent = selectedDelivery === 'inside' ? 'Inside Dhaka' : 'Outside Dhaka';
      delVal.textContent = '৳' + delAmt;
    } else {
      delRow.style.display = 'none';
    }
  }
  const bt = document.getElementById('bb-total');
  if (bt) bt.textContent = '৳' + currentGrandTotal.toLocaleString();
}

function renderOrder() {
  const listEl = document.getElementById('order-list');
  const sumEl = document.getElementById('order-summary');

  if (!order.length) {
    listEl.innerHTML = '<div class="order-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><p>No items yet.<br>Go to Price List to add.</p></div>';
    sumEl.innerHTML = '';
    return;
  }

  listEl.innerHTML = order.map((o,i) =>
    '<div class="order-item">' +
    '<div class="oi-info"><div class="oi-name">' + esc(o.name) + '</div><div class="oi-size">' + o.size + ' ml</div></div>' +
    '<div class="oi-price">৳' + o.price.toLocaleString() + '</div>' +
    '<button class="oi-remove" onclick="removeFromOrder(' + i + ')" aria-label="Remove"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>' +
    '</div>'
  ).join('');

  const perfumeTotal = order.reduce((s,o) => s + o.price, 0);
  const totalMl = order.reduce((s,o) => s + o.size, 0);
  currentGrandTotal = perfumeTotal;

  // Group items for summary
  const map = {};
  order.forEach(o => {
    const k = o.pid + '-' + o.size;
    if (!map[k]) map[k] = { name: o.name, size: o.size, price: o.price, qty: 0 };
    map[k].qty++;
  });
  const itemRows = Object.values(map).map(g =>
    '<div class="sum-row"><span>' + esc(g.name) + ' ' + g.size + 'ml' + (g.qty > 1 ? ' x' + g.qty : '') + '</span><span>৳' + (g.price * g.qty).toLocaleString() + '</span></div>'
  ).join('');

  sumEl.innerHTML =
    // Items summary
    '<div class="summary-box"><div class="sum-title">Items</div>' + itemRows +
    '<div class="sum-total"><span class="sum-total-label">' + order.length + ' item' + (order.length !== 1 ? 's' : '') + ' — ' + totalMl + 'ml</span>' +
    '<span class="sum-total-amt">৳' + perfumeTotal.toLocaleString() + '</span></div></div>' +

    // Delivery
    '<div class="step-label">Delivery</div>' +
    '<div class="delivery-opts">' +
      '<div class="delivery-card" id="del-none" onclick="selectDelivery(\'none\')" style="border-color:var(--accent);">' +
        '<div class="del-label">No Delivery</div><div class="del-price">৳0</div></div>' +
      '<div class="delivery-card" id="del-inside" onclick="selectDelivery(\'inside\')">' +
        '<div class="del-label">Inside Dhaka</div><div class="del-price">৳85</div></div>' +
      '<div class="delivery-card" id="del-outside" onclick="selectDelivery(\'outside\')">' +
        '<div class="del-label">Outside Dhaka</div><div class="del-price">৳125</div></div>' +
    '</div>' +

    // Bill
    '<div class="step-label">Bill</div>' +
    '<div class="bill-box">' +
      '<div class="bb-row"><span class="bb-lbl">Perfume Total</span><span class="bb-val">৳' + perfumeTotal.toLocaleString() + '</span></div>' +
      '<div class="bb-row" id="bb-del-row" style="display:none;"><span class="bb-lbl" id="bb-del-lbl">Delivery</span><span class="bb-val" id="bb-del-val">—</span></div>' +
      '<div class="bb-row bb-total-row"><span class="bb-total-lbl">Total Bill</span><span class="bb-total-val" id="bb-total">৳' + perfumeTotal.toLocaleString() + '</span></div>' +
    '</div>' +

    // Copy
    '<div class="step-label">Send Your Order</div>' +
    '<button class="btn-copy" onclick="copyOrder()">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>' +
      'Copy Order Summary' +
    '</button>' +
    '<button class="btn-messenger" onclick="sendToMessenger()">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.477 2 2 6.145 2 11.243c0 2.872 1.397 5.444 3.59 7.14V22l3.268-1.793c.872.242 1.797.372 2.742.372 5.523 0 10-4.145 10-9.243C22 6.145 17.523 2 12 2zm1.018 12.443l-2.545-2.714-4.97 2.714 5.467-5.801 2.608 2.714 4.908-2.714-5.468 5.801z"/></svg>' +
      'Send to Messenger' +
    '</button>' +
    '<p class="fb-note">Copy your order summary and send it to us, or tap Send to Messenger to open our chat directly.</p>' +
    '<button class="btn-clear" onclick="clearOrder()">' +
      '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>' +
      'Start Over' +
    '</button>';

  selectedDelivery = 'none';
  setTimeout(recalc, 0);
}

function sendToMessenger() {
  // Copy order first then open Messenger
  const map = {};
  order.forEach(o => {
    const k = o.pid + '-' + o.size;
    if (!map[k]) map[k] = { name: o.name, size: o.size, price: o.price, qty: 0 };
    map[k].qty++;
  });
  const lines = Object.values(map).map(g =>
    '- ' + g.name + ' ' + g.size + 'ml' + (g.qty > 1 ? ' x' + g.qty : '') + ' — ৳' + (g.price * g.qty).toLocaleString()
  );
  const perfumeTotal = order.reduce((s,o) => s + o.price, 0);
  const delAmt = selectedDelivery === 'inside' ? 85 : selectedDelivery === 'outside' ? 125 : 0;
  const grandTotal = perfumeTotal + delAmt;
  const delLine = delAmt > 0 ? '\nDelivery (' + (selectedDelivery === 'inside' ? 'Inside Dhaka' : 'Outside Dhaka') + '): ৳' + delAmt : '';
  const text = 'Fragranza Order\n\n' + lines.join('\n') + '\n\nPerfume Total: ৳' + perfumeTotal.toLocaleString() + delLine + '\n\nTotal Bill: ৳' + grandTotal.toLocaleString();
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).finally(() => {
      window.open('https://m.me/fragranzabangladesh', '_blank');
    });
  } else {
    window.open('https://m.me/fragranzabangladesh', '_blank');
  }
  showToast('Opening Messenger...');
}

function copyOrder() {
  if (!order.length) return;
  const map = {};
  order.forEach(o => {
    const k = o.pid + '-' + o.size;
    if (!map[k]) map[k] = { name: o.name, size: o.size, price: o.price, qty: 0 };
    map[k].qty++;
  });
  const lines = Object.values(map).map(g =>
    '- ' + g.name + ' ' + g.size + 'ml' + (g.qty > 1 ? ' x' + g.qty : '') + ' — ৳' + (g.price * g.qty).toLocaleString()
  );
  const perfumeTotal = order.reduce((s,o) => s + o.price, 0);
  const delAmt = selectedDelivery === 'inside' ? 85 : selectedDelivery === 'outside' ? 125 : 0;
  const grandTotal = perfumeTotal + delAmt;
  const delLine = delAmt > 0 ? '\nDelivery (' + (selectedDelivery === 'inside' ? 'Inside Dhaka' : 'Outside Dhaka') + '): ৳' + delAmt : '';
  const text = 'Fragranza Order\n\n' + lines.join('\n') + '\n\nPerfume Total: ৳' + perfumeTotal.toLocaleString() + delLine + '\n\nTotal Bill: ৳' + grandTotal.toLocaleString();
  navigator.clipboard.writeText(text).then(() => showToast('Copied! Paste on our Facebook page')).catch(() => showToast('Could not copy'));
}


function effectivePrice(p, size) {
  if (!p.offer) return p.prices[size];
  const s = String(size);
  if (p.offer.pct && p.offer.pct[s]) return Math.round(p.prices[size] * (1 - p.offer.pct[s] / 100));
  if (p.offer.manual && p.offer.manual[s]) return p.offer.manual[s];
  return p.prices[size];
}
function offerBadgeText(p) {
  if (!p.offer) return '';
  const pcts = p.offer.pct ? Object.values(p.offer.pct).filter(v => v > 0) : [];
  const mans = p.offer.manual ? Object.values(p.offer.manual).filter(v => v > 0) : [];
  if (pcts.length && mans.length) return 'OFFER';
  if (pcts.length) { const u = [...new Set(pcts)]; return u.length === 1 ? u[0] + '% OFF' : 'OFFER'; }
  if (mans.length) return 'SPECIAL';
  return '';
}

function copyBkash() {
  const text = '01518972783';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast('bKash number copied!'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    showToast('bKash number copied!');
  }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
